name: Build RadioCLI

on:
  push:
    tags: ['v*']

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: x86_64-apple-darwin
            binary_name: radio_cli
            asset_name: radio_cli-macos-intel
          - os: macos-latest
            target: aarch64-apple-darwin
            binary_name: radio_cli
            asset_name: radio_cli-macos-apple-silicon
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary_name: radio_cli
            asset_name: radio_cli-linux-x86_64

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install dependencies (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libsqlite3-dev mpv

      - name: Install dependencies (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          brew install sqlite mpv

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ matrix.target }}-cargo-

      - name: Add extra targets if needed
        run: |
          if [ "${{ matrix.target }}" = "aarch64-apple-darwin" ]; then
            rustup target add aarch64-apple-darwin
          fi

      - name: Build
        run: |
          cargo build --release --target ${{ matrix.target }}
          mkdir -p dist
          cp target/${{ matrix.target }}/release/${{ matrix.binary_name }} dist/
          cd dist && tar -czf ../${{ matrix.asset_name }}.tar.gz ${{ matrix.binary_name }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: ${{ matrix.asset_name }}.tar.gz
          if-no-files-found: error

  build-mac-app:
    name: Build RadioMac.dmg
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Build RadioMac (Release)
        run: |
          xcodebuild -project mac_app/radio-mac/radio-mac.xcodeproj \
            -scheme radio-mac \
            -configuration Release \
            -derivedDataPath build \
            -arch arm64 -arch x86_64 \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=NO

      - name: Create DMG
        run: |
          APP_PATH="build/Build/Products/Release/radio-mac.app"

          # Verify the app was built
          if [ ! -d "$APP_PATH" ]; then
            echo "Error: radio-mac.app not found at $APP_PATH"
            find build -name "*.app" -type d
            exit 1
          fi

          # Create a staging directory for the DMG contents
          DMG_DIR="dmg-staging"
          mkdir -p "$DMG_DIR"
          cp -R "$APP_PATH" "$DMG_DIR/RadioMac.app"

          # Create a symlink to /Applications for drag-install
          ln -s /Applications "$DMG_DIR/Applications"

          # Create the DMG
          hdiutil create -volname "RadioMac" \
            -srcfolder "$DMG_DIR" \
            -ov -format UDZO \
            "RadioMac.dmg"

          # Verify
          ls -lh RadioMac.dmg

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: RadioMac-dmg
          path: RadioMac.dmg
          if-no-files-found: error

  release:
    name: Create Release
    needs: [build, build-mac-app]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4

      - name: List downloaded files
        run: find . -type f \( -name "*.tar.gz" -o -name "*.dmg" \) | sort

      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v1
        with:
          draft: false
          prerelease: false
          files: |
            **/radio_cli-*.tar.gz
            **/RadioMac.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
