[package]
name = "radio_cli"
version = "1.3.7"
edition = "2021"
authors = ["schlunsen"]
description = "Terminal-based internet radio player with visualizations"
homepage = "https://github.com/schlunsen/radio-cli"
repository = "https://github.com/schlunsen/radio-cli"
readme = "README.md"
license = "MIT"
keywords = ["terminal", "radio", "audio", "tui", "visualization"]
categories = ["command-line-utilities", "multimedia"]

[features]
default = []
skip_mpv = []

[dependencies]
rusqlite = "0.31"
crossterm = "0.26"
ratatui = "0.24"
rand = "0.8"
dirs = "5"
reqwest = { version = "0.12.15", features = ["json"] }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1.45.0", features = ["rt", "rt-multi-thread", "macros"] }
thiserror = "1"
chrono = "0.4"

[dev-dependencies]
tempfile = "3"
